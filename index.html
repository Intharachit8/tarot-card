<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ดูดวงไพ่ทาโร่ 5 ใบ</title>
<link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#15112e;--bg2:#221a46;--ink:#f1e8d4;--mute:#d6cfee;--gold:#dcb65e;--plum:#7a4a8c;--line:#4a3d7a;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
main{position:relative}
.deck{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}
.pick{aspect-ratio:2/3.2;padding:0;min-height:0;border:2px solid var(--gold);border-radius:10px;background:none;cursor:pointer;position:relative;transition:transform .2s,opacity .5s}
.pick .back{border:0;border-radius:8px}
.pick:hover{transform:translateY(-5px)}
.pick.sel{transform:translateY(-9px);box-shadow:0 0 16px var(--gold)}
.pick.sel::before{content:attr(data-n);position:absolute;top:-10px;right:-8px;z-index:2;background:var(--gold);color:#1b1433;border-radius:50%;width:24px;height:24px;font-size:14px;display:grid;place-items:center}
.deck.full .pick:not(.sel){opacity:.4}
.hint{text-align:center;color:#f3cf7a;font:700 24px Charm,serif;margin-top:22px;text-shadow:0 2px 8px #000,0 0 3px #000}
.card .face{background:linear-gradient(#f4ecd8,#e2d1a2);box-shadow:inset 0 0 0 3px #f4ecd8,inset 0 0 0 4px var(--plum);justify-content:space-evenly;padding:8px 4px}
.face em{font:700 clamp(10px,2.6vw,15px)/1 Charm,serif;color:var(--plum);font-style:normal}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,var(--bg2),var(--bg) 60%) fixed;color:var(--ink);font:400 17px/1.85 Prompt,"Noto Sans Thai",system-ui,sans-serif;min-height:100vh}
main{max-width:920px;margin:0 auto;padding:28px 18px 60px}
h1{font:700 clamp(34px,8vw,56px)/1.15 Charm,"Noto Serif Thai",serif;margin:8px 0 6px;color:var(--gold);text-align:center;letter-spacing:.5px}
.sub{text-align:center;color:#ebe5f8;margin:0 auto 26px;max-width:520px;text-shadow:0 1px 6px #000}
.panel{border:1px solid var(--line);border-radius:14px;padding:18px;background:rgba(18,13,44,.9)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
select,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
button{cursor:pointer}
button.go{background:var(--gold);color:#1b1433;border-color:var(--gold);font-weight:500;padding:10px 26px}
button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.profile{margin-top:16px;text-align:center;color:#ebe5f8;font-size:16px}
.profile b{color:var(--gold);font-weight:500}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:26px 0 8px;perspective:900px}
.card{aspect-ratio:2/3.2;position:relative;transform-style:preserve-3d;transition:transform .8s}
.card.on{transform:rotateY(180deg)}
.card.on.rev .face{transform:rotateY(180deg) rotate(180deg)}
.side{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;border:2px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px;overflow:hidden}

.face{transform:rotateY(180deg);background:var(--ink);color:#2a2147;gap:2px}
.face i{font-style:normal;font-size:clamp(26px,8vw,52px);line-height:1.1}
.face span{font:700 clamp(12px,3vw,17px)/1.2 Charm,serif;color:#1f1740}
.face small{font-size:clamp(10px,2.4vw,13px);color:#4a2a5c;line-height:1.2}
.cap{text-align:center;font-size:12px;color:var(--mute);min-height:1.4em}
#out{display:none;margin-top:30px}
.sum{font:400 21px/1.7 Charm,serif;text-align:center;margin:0 0 20px;color:#f6f0e0;background:rgba(18,13,44,.9);padding:16px;border-radius:12px;border:1px solid var(--line)}
.read{margin:0 0 30px;background:rgba(18,13,44,.94);border:1px solid var(--line);border-radius:14px;overflow:hidden;scroll-margin-top:84px}
.rh{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:14px 18px;background:linear-gradient(90deg,#51338f,#2b2160);border-bottom:3px solid var(--gold)}
.rh .ic{font-size:36px;line-height:1}
.rh h3{margin:0;font:700 clamp(28px,7vw,36px)/1.1 Charm,serif;color:#fff}
.rh .bd{margin-left:auto;padding:4px 14px;border-radius:99px;font-size:15px;font-weight:500;color:#10102a;background:#f3cf7a}
.t1 .bd{background:#7be0ae}.t-1 .bd{background:#ff9aa8}
.rb{display:flex;gap:16px;padding:18px 18px 8px;align-items:flex-start}
.rb img{width:88px;flex:none;border-radius:6px;border:2px solid var(--gold)}
.rb img.rv{transform:rotate(180deg)}
.rb h2{margin:0 0 6px;font:700 clamp(22px,5.5vw,26px)/1.3 Charm,serif;color:#f3cf7a}
.rb .lead{margin:0;font-size:18px;font-weight:500;color:#fff;line-height:1.7}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 22px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:10px;background:rgba(18,13,44,.94);border:1px solid var(--line);border-radius:12px}
.chips a{min-height:40px;display:inline-flex;align-items:center;padding:4px 14px;border:2px solid var(--line);border-radius:99px;color:#fff;text-decoration:none;font-size:15px}
.chips a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.chips a.t1{border-color:#7be0ae}.chips a.t-1{border-color:#ff9aa8}.chips a.t0{border-color:#f3cf7a}
html{scroll-behavior:smooth}
.warn{display:flex;gap:10px;align-items:flex-start;max-width:640px;margin:0 auto 22px;padding:12px 16px;border:2px solid #f3cf7a;border-radius:12px;background:rgba(18,13,44,.92);color:#fff;line-height:1.7}
.warn b{flex:none;color:#10102a;background:#f3cf7a;border-radius:99px;padding:0 12px;font-weight:500}
@keyframes shuf{0%{transform:translate(0,0) rotate(0)}22%{transform:translate(var(--dx),var(--dy)) rotate(var(--r))}34%{transform:translate(calc(var(--dx) - 34px),var(--dy)) rotate(-9deg)}46%{transform:translate(calc(var(--dx) + 34px),calc(var(--dy) - 8px)) rotate(9deg)}58%{transform:translate(calc(var(--dx) - 28px),var(--dy)) rotate(-6deg)}70%{transform:translate(calc(var(--dx) + 28px),calc(var(--dy) + 8px)) rotate(6deg)}82%{transform:translate(var(--dx),var(--dy)) rotate(var(--r))}100%{transform:translate(0,0) rotate(0)}}
.deck.shuf .pick{animation:shuf 1.8s ease-in-out both;animation-delay:var(--d);z-index:var(--z);pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.6)}


.read p.essay{margin:0;padding:8px 18px 20px;color:#f1ecdf;line-height:2;max-width:72ch}

.again{display:block;margin:10px auto 0}
.note{text-align:center;color:#ebe5f8;font-size:14px;margin-top:24px;text-shadow:0 1px 5px #000}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
.face img{width:100%;flex:1;min-height:0;object-fit:contain;border-radius:3px;display:block}
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<main>
<h1>ไพ่ทาโร่ ทำนายดวง</h1>
<p class="sub">ใส่วันเดือนปีเกิด หรือกดสุ่มให้ แล้วเลือกไพ่ 5 ใบจาก 20 ใบที่คว่ำอยู่ เพื่ออ่านดวงทั้ง 5 ด้าน</p>

<div class="warn" role="note"><b>คำเตือน</b><span>ไพ่ยิปซีมีอำนาจลึกลับ จึงไม่ควรดูบ่อยเกินเดือนละ 1 ครั้ง</span></div>

<section class="panel">
<div class="row">
<select id="d" aria-label="วันที่เกิด"></select>
<select id="m" aria-label="เดือนเกิด"></select>
<select id="y" aria-label="ปีเกิด"></select>
<button id="rb" type="button">สุ่มวันเกิด</button>
</div>
<div class="row" style="margin-top:14px"><button class="go" id="go" type="button">สับไพ่ใหม่</button></div>
<div class="profile" id="prof"></div>
</section>

<div class="hint" id="hint" aria-live="polite"></div>
<div class="deck" id="deck"></div>
<div class="row"><button class="go" id="rv" type="button" hidden>เปิดไพ่ทำนาย</button></div>
<div class="cards" id="cards"></div>
<div class="cards" id="caps" style="margin:0;perspective:none"></div>

<section id="out" aria-live="polite">
<p class="sum" id="sum"></p>
<div id="reads"></div>
<button class="again" id="again" type="button">สุ่มไพ่ใหม่</button>
</section>
<p class="note">เพื่อความบันเทิงเท่านั้น ไม่ควรใช้แทนคำแนะนำทางการแพทย์ การเงิน หรือกฎหมาย</p>
</main>
